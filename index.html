<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>♱</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; color: white; font-family: monospace; user-select: none; }
        
        /* Start & Jumpscare Screens */
        #blocker { position: absolute; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: flex; align-items: center; justify-content: center; flex-direction: column; z-index: 10; cursor: pointer; text-align: center; }
        #jumpscare { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-color:#000; background-position:center; background-repeat:no-repeat; background-size:contain; z-index: 999; }
        #vhs { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: repeating-linear-gradient(rgba(0,0,0,0.1) 0px, rgba(0,0,0,0.1) 2px, transparent 2px, transparent 4px); pointer-events: none; z-index: 4; }
        
        /* UI Elements */
        #crosshair { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: white; font-size: 16px; z-index: 5; pointer-events: none; text-shadow: 0 0 2px black; font-weight: bold; }
        #respawn-msg { position: absolute; top: 15%; left: 50%; transform: translateX(-50%); font-size: 24px; color: #ff3333; font-weight: bold; display: none; text-shadow: 0 0 8px black; z-index: 5; text-align: center; letter-spacing: 2px; }
        #ui { position: absolute; bottom: 30px; left: 30px; width: 250px; z-index: 5; }
        #stamina-bg { width: 100%; height: 15px; background: rgba(50,50,50,0.5); border: 2px solid #555; margin-bottom: 10px; }
        #stamina-bar { width: 100%; height: 100%; background: white; transition: width 0.1s linear; }
        
        /* Roblox-style Inventory Hotbar (Center Bottom) */
        #inventory { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 6px; z-index: 5; background: rgba(0,0,0,0.4); padding: 6px; border-radius: 8px; border: 1px solid #444; }
        .inv-slot { width: 45px; height: 45px; background: rgba(30,30,30,0.8); border: 2px solid #555; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: bold; color: #888; border-radius: 6px; position: relative; }
        .inv-slot.active { border-color: #fff; background: rgba(70,70,70,0.9); color: #fff; box-shadow: 0 0 8px rgba(255,255,255,0.3); }
        .inv-num { position: absolute; top: 2px; left: 5px; font-size: 9px; color: #aaa; }
        #ammo-display { display: none; margin-top: 5px; font-size: 14px; color: #ff3333; font-weight: bold; }

        /* Tactical Canvas Radar */
        #radar { position: absolute; top: 20px; right: 20px; width: 150px; height: 150px; background: rgba(0, 20, 0, 0.85); border: 2px solid #0f0; border-radius: 5px; z-index: 5; overflow: hidden; }
        .radar-label { position: absolute; color: #0f0; font-size: 10px; font-weight: bold; pointer-events: none; text-shadow: 0 0 2px #000; z-index: 6; }

        /* Settings Menu */
        #settings-menu { display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(20,20,20,0.95); padding: 30px; border: 1px solid #555; z-index: 15; width: 300px; text-align: center; box-shadow: 0 0 20px black; }
        .setting-row { margin-bottom: 20px; text-align: left; }
        .setting-row label { display: block; margin-bottom: 5px; }
        input[type="range"], input[type="text"] { width: 100%; box-sizing: border-box; }
        input[type="text"] { padding: 5px; background: #000; color: #fff; border: 1px solid #555; margin-bottom: 10px; text-transform: uppercase; }
        button { background: #333; color: white; border: 1px solid #777; padding: 5px 15px; cursor: pointer; width: 100%; }
        button:hover { background: #555; }
    </style>
</head>
<body>
    <div id="vhs"></div>
    <div id="crosshair">+</div>
    <div id="respawn-msg">20s</div>
    
    <div id="radar">
        <canvas id="radarCanvas" width="150" height="150"></canvas>
        <div class="radar-label" style="top: 2px; left: 50%; transform: translateX(-50%);">N</div>
        <div class="radar-label" style="bottom: 2px; left: 50%; transform: translateX(-50%);">S</div>
        <div class="radar-label" style="top: 50%; left: 4px; transform: translateY(-50%);">W</div>
        <div class="radar-label" style="top: 50%; right: 4px; transform: translateY(-50%);">E</div>
    </div>

    <div id="blocker">
        <h1>@racksdoubled</h1>
        <p>i was js bored asf so i made ts</p>
        <p>you can get a free ak with 20 ammos</p>
        <p>press 0 then type in AK in the redeem section</p>
    </div>
    
    <div id="settings-menu">
        <h2>settings</h2>
        <div class="setting-row">
            <label>sensitivity: <span id="sens-val">1.0</span></label>
            <input type="range" id="sens-slider" min="0.1" max="3" step="0.1" value="1.0">
        </div>
        <div class="setting-row">
            <label>field of view (FOV): <span id="fov-val">75</span></label>
            <input type="range" id="fov-slider" min="50" max="110" step="1" value="75">
        </div>
        <div class="setting-row" style="border-top: 1px solid #444; padding-top: 15px;">
            <label>redeem code:</label>
            <input type="text" id="promo-code" placeholder="Enter Code">
            <button id="redeem-btn">redeem</button>
            <div id="redeem-msg" style="color: #0f0; font-size: 12px; margin-top: 5px; height: 15px;"></div>
        </div>
        <button id="close-settings" style="margin-top: 15px; background: #500;">Close</button>
    </div>

    <div id="ui">
        <p style="margin: 0 0 5px 0;">stamina</p>
        <div id="stamina-bg"><div id="stamina-bar"></div></div>
        <div id="ammo-display">ammo: <span id="ammo-count">10</span></div>
    </div>

    <!-- Roblox-style Inventory Hotbar (Center Bottom) -->
    <div id="inventory">
        <div id="slot-1" class="inv-slot active"><span class="inv-num">1</span>flash</div>
        <div id="slot-2" class="inv-slot" style="opacity: 0.4;"><span class="inv-num">2</span>locked</div>
    </div>
    
    <div id="jumpscare"></div>

    </script>

        gunBarrel.position.set(0.25, -0.22, -0.85);
        gunGroup.add(gunBarrel);

        const gunStock = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.12, 0.4), woodMat);
        gunStock.position.set(0.25, -0.27, -0.15);
        gunGroup.add(gunStock);

        const gunMag = new THREE.Mesh(new THREE.BoxGeometry(0.07, 0.3, 0.12), gunMat);
        gunMag.rotation.x = 0.3;
        gunMag.position.set(0.25, -0.42, -0.55);
        gunGroup.add(gunMag);

        camera.add(gunGroup);
        gunGroup.visible = false;
        let gunRecoil = 0;

        // 3. MAP GENERATION & MOMO POSTER
        const wallMat = new THREE.MeshStandardMaterial({ color: 0x333333, roughness: 1 });
        const floorMat = new THREE.MeshStandardMaterial({ color: 0x111111 });
        
        scene.add(new THREE.Mesh(new THREE.PlaneGeometry(300, 300).rotateX(-Math.PI/2), floorMat));
        const roof = new THREE.Mesh(new THREE.PlaneGeometry(300, 300).rotateX(Math.PI/2), new THREE.MeshStandardMaterial({ color: 0x050505 }));
        roof.position.y = 3;
        scene.add(roof);

        const colliders = [];
        const raycastWalls = [];
        const wallGeo = new THREE.BoxGeometry(3, 3, 3);

        // Guaranteed corridor between the player spawn (0,0) and monster spawn (12,-12) —
        // carved in before random walls are placed, so the monster can never be sealed off
        // in a disconnected pocket no matter how the random rolls land.
        const guaranteedOpen = new Set();
        for (let i = 0; i <= 12; i++) guaranteedOpen.add(i + ',0');
        for (let j = 0; j >= -12; j--) guaranteedOpen.add('12,' + j);

        for (let i = -25; i <= 25; i++) {
            for (let j = -25; j <= 25; j++) {
                let isBorder = (i === -25 || i === 25 || j === -25 || j === 25);
                let isSpawnCenter = (Math.abs(i) < 2 && Math.abs(j) < 2);
                let isMonsterSpawnZone = (Math.abs(i - 12) < 2 && Math.abs(j + 12) < 2);
                let isCorridor = guaranteedOpen.has(i + ',' + j);

                // Wall density dropped from 40% to 18% — 40% sat right at the point where a
                // random grid like this tends to fragment into disconnected pockets instead
                // of staying one connected space.
                if (isBorder || (!isSpawnCenter && !isMonsterSpawnZone && !isCorridor && Math.random() > 0.82)) {
                    const wall = new THREE.Mesh(wallGeo, wallMat);
                    wall.position.set(i * 3, 1.5, j * 3);
                    scene.add(wall);
                    colliders.push(new THREE.Box3().setFromObject(wall));
                    raycastWalls.push(wall);
                }
            }
        }

        // Load the Momo photo and place it on a random wall
        const textureLoader = new THREE.TextureLoader();
        textureLoader.load(MOMO_IMG_SRC, (texture) => {
            if (raycastWalls.length > 0) {
                const randomWall = raycastWalls[Math.floor(Math.random() * raycastWalls.length)];
                const posterGeo = new THREE.PlaneGeometry(2.6, 2.6);
                const posterMat = new THREE.MeshBasicMaterial({ map: texture });
                const poster = new THREE.Mesh(posterGeo, posterMat);
                
                const offsets = [
                    { pos: [0, 0, 1.51], rot: [0, 0, 0] },
                    { pos: [0, 0, -1.51], rot: [0, Math.PI, 0] },
                    { pos: [1.51, 0, 0], rot: [0, Math.PI/2, 0] },
                    { pos: [-1.51, 0, 0], rot: [0, -Math.PI/2, 0] }
                ];
                const chosen = offsets[Math.floor(Math.random() * offsets.length)];
                poster.position.set(chosen.pos[0], chosen.pos[1], chosen.pos[2]);
                poster.rotation.set(chosen.rot[0], chosen.rot[1], chosen.rot[2]);
                randomWall.add(poster);
            }
        });

        // 4. THE MONSTER — a simple glowing question mark
        const monsterMat = new THREE.MeshStandardMaterial({ color: 0x000000, emissive: 0xffffff, emissiveIntensity: 0.75, roughness: 0.5 });
        const monsterGroup = new THREE.Group();

        const head = new THREE.Mesh(new THREE.TorusGeometry(0.8, 0.18, 10, 24, Math.PI*1.5), monsterMat);
        head.rotation.z = Math.PI * 0.62;
        head.position.y = 2.9;
        head.userData = { part: 'head' };
        monsterGroup.add(head);

        const body = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.18, 1.9, 10), monsterMat);
        body.position.y = 1.6;
        body.rotation.z = 0.1;
        body.userData = { part: 'body' };
        monsterGroup.add(body);

        const dot = new THREE.Mesh(new THREE.SphereGeometry(0.24, 12, 12), monsterMat);
        dot.position.y = 0.45;
        monsterGroup.add(dot);

        const monsterGlow = new THREE.PointLight(0xffffff, 0.8, 6, 2);
        monsterGlow.position.y = 2;
        monsterGroup.add(monsterGlow);

        monsterGroup.position.set(36, 0, -36); 
        scene.add(monsterGroup);

        // Solid-cell grid for monster pathfinding, built from the walls actually generated above
        // (not recomputed from Math.random(), which would no longer match what was placed).
        const solidCells = new Set();
        for (const w of raycastWalls) {
            const gi = Math.round(w.position.x / 3);
            const gj = Math.round(w.position.z / 3);
            solidCells.add(gi + ',' + gj);
        }
        function cellOpen(gi, gj) { return !solidCells.has(gi + ',' + gj); }
        function worldToCell(pos) { return { gi: Math.round(pos.x / 3), gj: Math.round(pos.z / 3) }; }
        function cellToWorld(gi, gj) { return new THREE.Vector3(gi * 3, 0, gj * 3); }

        // Bounded BFS so the monster can actually navigate around walls instead of
        // just walking in a straight line and freezing the moment it hits one.
        function findPath(fromCell, toCell, maxNodes) {
            const key = (c) => c.gi + ',' + c.gj;
            if (fromCell.gi === toCell.gi && fromCell.gj === toCell.gj) return [fromCell];
            const visited = new Set([key(fromCell)]);
            const queue = [[fromCell]];
            let explored = 0;
            while (queue.length && explored < maxNodes) {
                const path = queue.shift();
                const cell = path[path.length - 1];
                explored++;
                const neighbors = [
                    { gi: cell.gi + 1, gj: cell.gj }, { gi: cell.gi - 1, gj: cell.gj },
                    { gi: cell.gi, gj: cell.gj + 1 }, { gi: cell.gi, gj: cell.gj - 1 }
                ];
                for (const n of neighbors) {
                    if (!cellOpen(n.gi, n.gj)) continue;
                    const k = key(n);
                    if (visited.has(k)) continue;
                    const newPath = path.concat([n]);
                    if (n.gi === toCell.gi && n.gj === toCell.gj) return newPath;
                    visited.add(k);
                    queue.push(newPath);
                }
            }
            return null;
        }
        let monsterPath = [];
        let monsterRepathTimer = 0;

        // 5. GAME & COMBAT LOGIC
        let hasGun = false;
        let ammo = 0;
        let monsterHp = 3;
        let isMonsterDead = false;
        let activeSlot = 1;
        const raycaster = new THREE.Raycaster();

        // 6. AUDIO & PROCEDURAL EFFECTS
        // No flashlight click file was uploaded this round, so it's synthesized instead (see playFlashlightClick).
        const jumpscareSound = new Audio(JUMPSCARE_SOUND_SRC);
        let audioCtx, lastFootstepTime = 0;
        
        function initAudio() {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const osc1 = audioCtx.createOscillator(); osc1.type = 'sine'; osc1.frequency.value = 45; 
            const osc2 = audioCtx.createOscillator(); osc2.type = 'triangle'; osc2.frequency.value = 55; 
            const gainNode = audioCtx.createGain(); gainNode.gain.value = 0.3; 
            osc1.connect(gainNode); osc2.connect(gainNode); gainNode.connect(audioCtx.destination);
            osc1.start(); osc2.start();
        }

        function playFlashlightClick() {
            if (!audioCtx) return;
            const now = audioCtx.currentTime;
            // sharp high transient (the switch snapping)
            const osc1 = audioCtx.createOscillator(); osc1.type = 'square'; osc1.frequency.setValueAtTime(2200, now);
            const g1 = audioCtx.createGain(); g1.gain.setValueAtTime(0.22, now); g1.gain.exponentialRampToValueAtTime(0.001, now + 0.02);
            osc1.connect(g1); g1.connect(audioCtx.destination); osc1.start(now); osc1.stop(now + 0.02);
            // low thunk (the casing)
            const osc2 = audioCtx.createOscillator(); osc2.type = 'sine'; osc2.frequency.setValueAtTime(170, now + 0.005);
            osc2.frequency.exponentialRampToValueAtTime(65, now + 0.08);
            const g2 = audioCtx.createGain(); g2.gain.setValueAtTime(0.3, now + 0.005); g2.gain.exponentialRampToValueAtTime(0.001, now + 0.09);
            osc2.connect(g2); g2.connect(audioCtx.destination); osc2.start(now + 0.005); osc2.stop(now + 0.1);
        }

        function playFootstep() {
            if (!audioCtx) return;
            const now = audioCtx.currentTime;
            // soft filtered noise transient — the general "step" impact
            const bufferSize = Math.floor(audioCtx.sampleRate * 0.09);
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) data[i] = (Math.random()*2-1) * (1 - i/bufferSize);
            const noise = audioCtx.createBufferSource(); noise.buffer = buffer;
            const lowpass = audioCtx.createBiquadFilter();
            lowpass.type = 'lowpass'; lowpass.frequency.value = 380 + Math.random()*140;
            const noiseGain = audioCtx.createGain();
            noiseGain.gain.setValueAtTime(0.4, now); noiseGain.gain.exponentialRampToValueAtTime(0.001, now + 0.09);
            noise.connect(lowpass); lowpass.connect(noiseGain); noiseGain.connect(audioCtx.destination);
            noise.start(now);

            // low soft thump underneath for a bit of weight, no metallic ring
            const osc = audioCtx.createOscillator(); osc.type = 'sine';
            osc.frequency.setValueAtTime(95, now); osc.frequency.exponentialRampToValueAtTime(45, now + 0.07);
            const g = audioCtx.createGain();
            g.gain.setValueAtTime(0.22, now); g.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
            osc.connect(g); g.connect(audioCtx.destination);
            osc.start(now); osc.stop(now + 0.09);
        }
        
        function playGunshot() {
            if (!audioCtx) return;
            const now = audioCtx.currentTime;
            const bufferSize = audioCtx.sampleRate * 0.3;
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) { data[i] = Math.random() * 2 - 1; }
            
            const noise = audioCtx.createBufferSource();
            noise.buffer = buffer;

            const filter = audioCtx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(1200, now);
            filter.frequency.exponentialRampToValueAtTime(80, now + 0.3);

            const gain = audioCtx.createGain();
            gain.gain.setValueAtTime(1.0, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);

            noise.connect(filter);
            filter.connect(gain);
            gain.connect(audioCtx.destination);
            noise.start(now);
        }

        // 7. INPUT HANDLING
        let stamina = 100; let isDead = false;
        const keys = { w: false, a: false, s: false, d: false, shift: false };
        let prevTime = performance.now();

        document.addEventListener('keydown', (e) => { 
            if (e.key.toLowerCase() in keys) keys[e.key.toLowerCase()] = true; 
            
            if (e.key === '1') {
                activeSlot = 1;
                document.getElementById('slot-1').classList.add('active');
                document.getElementById('slot-2').classList.remove('active');
                gunGroup.visible = false;
            } else if (e.key === '2' && hasGun) {
                activeSlot = 2;
                document.getElementById('slot-2').classList.add('active');
                document.getElementById('slot-1').classList.remove('active');
                gunGroup.visible = true;
            }

            if (e.key === '0') {
                if (controls.isLocked) {
                    controls.unlock();
                    document.getElementById('settings-menu').style.display = 'block';
                    document.getElementById('blocker').style.display = 'none';
                }
            }
        });
        document.addEventListener('keyup', (e) => { if (e.key.toLowerCase() in keys) keys[e.key.toLowerCase()] = false; });
        
        // LEFT CLICK HANDLER
        document.addEventListener('mousedown', (e) => {
            if (!controls.isLocked || isDead || e.button !== 0) return;
            
            if (activeSlot === 1) {
                isFlashlightOn = !isFlashlightOn;
                flashlight.intensity = isFlashlightOn ? 2.5 : 0;
                playFlashlightClick();
            } 
            else if (activeSlot === 2 && ammo > 0) {
                ammo--;
                document.getElementById('ammo-count').innerText = ammo;
                playGunshot();
                gunRecoil = 0.15;

                raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
                const targets = [...raycastWalls, body, head];
                const intersects = raycaster.intersectObjects(targets);

                if (intersects.length > 0) {
                    const hit = intersects[0].object;
                    if (hit.userData.part === 'head') {
                        monsterHp = 0;
                    } else if (hit.userData.part === 'body') {
                        monsterHp--;
                    }

                    if (monsterHp <= 0 && !isMonsterDead) {
                        isMonsterDead = true;
                        monsterGroup.visible = false;
                        monsterGroup.position.set(999, -999, 999);

                        const respawnMsg = document.getElementById('respawn-msg');
                        respawnMsg.style.display = 'block';

                        setTimeout(() => {
                            monsterGroup.position.set(36, 0, -36);
                            monsterGroup.visible = true;
                            monsterHp = 3;
                            isMonsterDead = false;
                            respawnMsg.style.display = 'none';
                        }, 20000);
                    }
                }
            }
        });

        // 8. SETTINGS LOGIC
        document.getElementById('sens-slider').addEventListener('input', (e) => {
            controls.pointerSpeed = parseFloat(e.target.value);
            document.getElementById('sens-val').innerText = e.target.value;
        });

        document.getElementById('fov-slider').addEventListener('input', (e) => {
            camera.fov = parseInt(e.target.value);
            camera.updateProjectionMatrix();
            document.getElementById('fov-val').innerText = e.target.value;
        });

        document.getElementById('redeem-btn').addEventListener('click', () => {
            const code = document.getElementById('promo-code').value.toUpperCase();
            if (code === 'AK') {
                hasGun = true; ammo = 10;
                document.getElementById('slot-2').style.opacity = '1';
                document.getElementById('slot-2').innerHTML = '<span class="inv-num">2</span>AK';
                document.getElementById('ammo-display').style.display = 'block';
                document.getElementById('ammo-count').innerText = ammo;
                document.getElementById('redeem-msg').innerText = "AK Unlocked! Press '2' to equip.";
            } else {
                document.getElementById('redeem-msg').innerText = "Invalid Code";
                document.getElementById('redeem-msg').style.color = "red";
            }
        });

        document.getElementById('close-settings').addEventListener('click', () => {
            document.getElementById('settings-menu').style.display = 'none';
            controls.lock();
        });

        // 9. RADAR CANVAS RENDERING
        const radarCanvas = document.getElementById('radarCanvas');
        const rCtx = radarCanvas.getContext('2d');
        const radarScale = 3.2;

        function updateRadar() {
            rCtx.fillStyle = 'rgba(0, 20, 0, 0.85)';
            rCtx.fillRect(0, 0, 150, 150);

            const centerX = 75;
            const centerY = 75;

            // Draw Walls
            rCtx.fillStyle = '#1e3f1e';
            for (let wall of raycastWalls) {
                let dx = (wall.position.x - camera.position.x) * radarScale;
                let dz = (wall.position.z - camera.position.z) * radarScale;
                if (Math.abs(dx) < 85 && Math.abs(dz) < 85) {
                    rCtx.fillRect(centerX + dx - 4, centerY + dz - 4, 8, 8);
                }
            }

            // Draw Monster
            if (!isMonsterDead) {
                let mdx = (monsterGroup.position.x - camera.position.x) * radarScale;
                let mdz = (monsterGroup.position.z - camera.position.z) * radarScale;
                rCtx.fillStyle = '#ff0000';
                rCtx.beginPath();
                rCtx.arc(centerX + mdx, centerY + mdz, 4.5, 0, Math.PI * 2);
                rCtx.fill();
            }

            // Draw Player
            rCtx.fillStyle = '#00ff00';
            rCtx.beginPath();
            rCtx.arc(centerX, centerY, 3.5, 0, Math.PI * 2);
            rCtx.fill();
        }

        // 10. MAIN GAME LOOP
        function animate() {
            requestAnimationFrame(animate);
            
            updateRadar();

            if (gunRecoil > 0) {
                gunRecoil -= 0.01;
                gunGroup.position.z = -0.5 + gunRecoil;
                gunGroup.rotation.x = gunRecoil * 2;
            }

            if (!controls.isLocked || isDead) return;

            const time = performance.now();
            const delta = Math.min((time - prevTime) / 1000, 0.1); 
            prevTime = time;

            const isMoving = keys.w || keys.a || keys.s || keys.d;
            let currentSpeed = 6.0; 

            if (keys.shift && isMoving && stamina > 0) {
                currentSpeed = 12.0; 
                stamina -= (100 / 10) * delta; 
            } else if (!isMoving) {
                stamina += (100 / 20) * delta; 
            }
            
            stamina = Math.max(0, Math.min(100, stamina));
            document.getElementById('stamina-bar').style.width = stamina + '%';
            document.getElementById('stamina-bar').style.backgroundColor = stamina < 1 ? 'red' : 'white';

            if (isMoving) {
                const stepDelay = keys.shift && stamina > 0 ? 300 : 500;
                if (time - lastFootstepTime > stepDelay) { playFootstep(); lastFootstepTime = time; }
            }

            // CLEAN AXIS-SEPARATED COLLISION & MOVEMENT
            const playerPos = camera.position;
            const speed = currentSpeed * delta;

            const forwardDir = new THREE.Vector3();
            camera.getWorldDirection(forwardDir);
            forwardDir.y = 0;
            forwardDir.normalize();

            const rightDir = new THREE.Vector3(-forwardDir.z, 0, forwardDir.x);

            // X / Strafe Movement
            let strafeInput = (keys.d ? 1 : 0) - (keys.a ? 1 : 0);
            if (strafeInput !== 0) {
                const moveX = rightDir.clone().multiplyScalar(strafeInput * speed);
                playerPos.add(moveX);
                let playerBox = new THREE.Box3().setFromCenterAndSize(playerPos, new THREE.Vector3(0.6, 1.8, 0.6));
                for (let box of colliders) {
                    if (playerBox.intersectsBox(box)) {
                        playerPos.sub(moveX);
                        break;
                    }
                }
            }

            // Z / Forward Movement
            let forwardInput = (keys.w ? 1 : 0) - (keys.s ? 1 : 0);
            if (forwardInput !== 0) {
                const moveZ = forwardDir.clone().multiplyScalar(forwardInput * speed);
                playerPos.add(moveZ);
                let playerBox = new THREE.Box3().setFromCenterAndSize(playerPos, new THREE.Vector3(0.6, 1.8, 0.6));
                for (let box of colliders) {
                    if (playerBox.intersectsBox(box)) {
                        playerPos.sub(moveZ);
                        break;
                    }
                }
            }

            // Monster AI & Jumpscare
            if (!isMonsterDead) {
                // Horizontal-only distance — the old version used the full 3D distance, and
                // since the camera sits at y=1.5 while the monster's origin is y=0, that
                // distance could never drop below 1.5 even standing right on top of you.
                // That's why it could never actually catch you.
                const hdx = monsterGroup.position.x - camera.position.x;
                const hdz = monsterGroup.position.z - camera.position.z;
                const dist = Math.hypot(hdx, hdz);
                const mSpeed = 15.5 * delta; // faster than your sprint (12.0) — always closing the gap

                monsterRepathTimer -= delta;
                if (monsterRepathTimer <= 0 || monsterPath.length === 0) {
                    monsterRepathTimer = 0.4;
                    const fromCell = worldToCell(monsterGroup.position);

                    if (isFlashlightOn) {
                        // Flashlight on: hunt you down
                        const toCell = worldToCell(camera.position);
                        const path = findPath(fromCell, toCell, 900);
                        if (path && path.length > 1) {
                            monsterPath = path.slice(1);
                        } else if (monsterPath.length === 0) {
                            const options = [
                                { gi: fromCell.gi + 1, gj: fromCell.gj }, { gi: fromCell.gi - 1, gj: fromCell.gj },
                                { gi: fromCell.gi, gj: fromCell.gj + 1 }, { gi: fromCell.gi, gj: fromCell.gj - 1 }
                            ].filter(c => cellOpen(c.gi, c.gj));
                            if (options.length > 0) monsterPath = [options[Math.floor(Math.random()*options.length)]];
                        }
                    } else {
                        // Flashlight off: flee — path toward a cell on the opposite side of you
                        const awayX = fromCell.gi + Math.sign(fromCell.gi - worldToCell(camera.position).gi || 1) * 6;
                        const awayZ = fromCell.gj + Math.sign(fromCell.gj - worldToCell(camera.position).gj || 1) * 6;
                        const clampedTarget = { gi: Math.max(-24, Math.min(24, awayX)), gj: Math.max(-24, Math.min(24, awayZ)) };
                        const path = findPath(fromCell, clampedTarget, 900);
                        if (path && path.length > 1) monsterPath = path.slice(1);
                    }
                }

                if (monsterPath.length > 0) {
                    const target = cellToWorld(monsterPath[0].gi, monsterPath[0].gj);
                    const dx = target.x - monsterGroup.position.x;
                    const dz = target.z - monsterGroup.position.z;
                    const d = Math.hypot(dx, dz);
                    if (d < 0.25) {
                        monsterPath.shift();
                    } else {
                        const nx = dx / d, nz = dz / d;
                        const moveSpeed = isFlashlightOn ? mSpeed : mSpeed * 0.6; // flees a bit slower than it hunts
                        monsterGroup.position.x += nx * moveSpeed;
                        monsterGroup.position.z += nz * moveSpeed;
                        monsterGroup.rotation.y = Math.atan2(nx, nz);
                    }
                }

                if (isFlashlightOn && dist < 1.8 && !isDead) {
                    isDead = true;
                    controls.unlock();
                    document.getElementById('jumpscare').style.display = 'block';
                    document.getElementById('ui').style.display = 'none';
                    document.getElementById('crosshair').style.display = 'none';
                    jumpscareSound.play().catch(e => {});
                }
            }

            renderer.render(scene, camera);
        }

        animate();
        
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
